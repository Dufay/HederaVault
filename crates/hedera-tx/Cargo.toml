[package]
name = "hedera-tx"
version = "0.1.0"
edition = "2024"

[dependencies]
ed25519-dalek = "2"
k256 = { version = "0.13", features = ["ecdsa"] }
prost = "0.13"
sha3 = "0.10"
tonic = { version = "0.12", default-features = false, features = ["transport", "prost", "codegen"] }
wallet-core = { path = "../wallet-core" }
