[package]
name = "signer-core"
version = "0.1.0"
edition = "2024"
description = "Offline signer core: parses a signing request, shows every field, signs only what it fully understands."

# No network, no wallet or app crates. Keep this dependency list short.
[dependencies]
ed25519-dalek = "2"
k256 = { version = "0.13", features = ["ecdsa"] }
prost = "0.13"
sha3 = "0.10"
zeroize = "1.9"

[dev-dependencies]
hedera-tx = { path = "../hedera-tx" }
# Only to cross-check the checksum against the app's implementation.
wallet-core = { path = "../wallet-core" }
