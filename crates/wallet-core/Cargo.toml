[package]
name = "wallet-core"
version = "0.1.0"
edition = "2024"

[dependencies]
bip39 = "2"
rand = "0.8"
ed25519-dalek = "2"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
argon2 = "0.5"
aes-gcm = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zeroize = "1.9"
chrono = { version = "0.4", features = ["serde"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
